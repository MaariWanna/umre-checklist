const G={0:"Përgatitja",9:"Rrugëtimi",14:"Ritualet e Umres",19:"Medina & dua"};
const K='umre-checklist-v1';let S={};
try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const chk=s=>s[0]!=='#'&&s[0]!=='!';
const cnt=i=>{let d=0,n=0;C[i][3].forEach((s,j)=>{if(chk(s)){n++;if(S[i+'-'+j])d++}});return[d,n]};
function home(){let a=0,t=0,h='';C.forEach((c,i)=>{if(G[i])h+=`<div class="gh">${G[i]}</div>`;const[d,n]=cnt(i);a+=d;t+=n;h+=`<button class="cat" data-i="${i}" style="background:${c[2]}"><span class="ic">${c[1]}</span>${c[0]}<div class="b"><i style="width:${n?d/n*100:0}%"></i></div><span class="n">${d} / ${n} të shënuara</span></button>`});
 $('home').innerHTML=h;
 $('sum').textContent=`Gjithsej: ${a} nga ${t} të shënuara`;$('tb').style.width=a/t*100+'%'}
function show(i){$('home').hidden=$('sum').parentNode.hidden=i!==null;$('cat').hidden=i===null;
 if(i===null){home();return}
 $('ct').textContent=C[i][1]+' '+C[i][0];
 $('items').innerHTML=C[i][3].map((s,j)=>{
  if(s[0]==='#')return`<h3 class="hd">${s.slice(1)}</h3>`;
  if(s[0]==='!'){const[a,b]=s.slice(1).split('|');return`<div class="inf"><b>${a}</b>${b?`<small>${b}</small>`:''}</div>`}
  const p=s.split('|'),a=p[0],c=p.find(x=>/[\u0600-\u06FF]/.test(x)),b=p[1]&&p[1]!==c?p[1]:'';
  return`<div class="it${S[i+'-'+j]?' on':''}" data-j="${j}"><span class="bx">${S[i+'-'+j]?'✓':''}</span><span class="tx">${a}${b?`<small>${b}</small>`:''}${c?`<span class="ar" dir="rtl" lang="ar">${c}</span>`:''}</span></div>`}).join('');
 const[d,n]=cnt(i);$('cb').style.width=(n?d/n*100:0)+'%';scrollTo(0,0)}
let cur=null;
const go=i=>{cur=i;try{location.hash=i===null?'':'c'+i}catch(e){}show(i)};
$('home').onclick=e=>{const b=e.target.closest('.cat');if(b)go(+b.dataset.i)};
$('back').onclick=()=>go(null);
$('items').onclick=e=>{const r=e.target.closest('.it');if(!r)return;const k=cur+'-'+r.dataset.j;S[k]=!S[k];save();const y=scrollY;show(cur);scrollTo(0,y)};
$('rs').onclick=()=>{if(confirm('Të fshihen të gjitha shënimet?')){S={};save();show(cur)}};
try{const h=location.hash.match(/^#c(\d+)$/);cur=h&&C[+h[1]]?+h[1]:null}catch(e){}
show(cur);
